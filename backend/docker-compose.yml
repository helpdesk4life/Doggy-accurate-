services:
  redis:
    image: redis:7-alpine
    # AOF so accounts survive a restart. The geo index is disposable, but the
    # user store is not.
    command: ["redis-server", "--appendonly", "yes"]
    # Without this a reboot leaves the whole stack down and nothing says so.
    # `unless-stopped` rather than `always`: a container you stopped on purpose
    # stays stopped.
    restart: unless-stopped
    # Loopback only, for the same reason the backend is: Redis has no password
    # here, so publishing it on 0.0.0.0 hands an unauthenticated datastore to
    # anyone who can reach the host. The scripts in scripts/ run on the host and
    # connect to redis://localhost:6379, which this still satisfies.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The geo index is disposable - a walker with no fix for WALKER_TTL_SECONDS is
  # dropped - so this instance runs with persistence OFF on purpose: live GPS
  # positions are the most sensitive data in the deployment and must never be
  # written to the AOF of the persistent redis above. No published port; only
  # the backend container reaches it over the compose network.
  redis-geo:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    # Loopback only. The app is meant to be reached through Caddy, which is what
    # terminates TLS and sets X-Forwarded-For. Publishing 8000 on 0.0.0.0 would
    # let anyone on the LAN skip TLS and spoof the header the rate limiter bills
    # against. The scripts in scripts/ run on the host, so loopback is enough.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      # Positions live here, not on the AOF-persisted redis: see redis-geo above.
      GEO_REDIS_URL: redis://redis-geo:6379/0
      PROXIMITY_RADIUS_M: "500"
      WALKER_TTL_SECONDS: "30"
      SWEEP_INTERVAL_SECONDS: "5"
      # Anything other than development makes the backend refuse to boot with the
      # public development secret. See app/config.py.
      DOGWALK_ENV: ${DOGWALK_ENV:-development}
      # Override this in a .env file or the shell before exposing the service.
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me-0123456789}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # Registration needs a single-use code, minted with scripts/mint_invites.py.
      # This is what stops /auth/register being used to ask whether an address
      # has an account. Only turn it off once there is email verification.
      INVITE_REQUIRED: ${INVITE_REQUIRED:-1}
      # A .env file only feeds ${...} interpolation in this file; anything the
      # backend must actually see has to be forwarded here explicitly. Without
      # these two, a production .env per deploy/VPS.md refuses to boot: the
      # validator refuses EMAIL_SENDER=logging unless it can see the
      # acknowledgement below.
      EMAIL_SENDER: ${EMAIL_SENDER:-logging}
      ALLOW_LOGGING_EMAIL: ${ALLOW_LOGGING_EMAIL:-0}
      # Only read when EMAIL_SENDER=smtp. Forwarded for the same reason as the
      # two above: a .env file feeds ${...} interpolation here, and nothing else.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    depends_on:
      redis:
        condition: service_healthy
      redis-geo:
        condition: service_healthy
    # The image is python:3.12-slim, so there is no curl to probe with. This is
    # the same endpoint deploy/verify.sh checks from outside, which is the point:
    # `docker compose ps` should say "healthy" only when the app answers.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # TLS terminator. Caddy issues itself a local CA, so wss:// works without a
  # domain. Point the app at wss://<host>:8443/ws/walk once you trust the CA.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend

volumes:
  redis-data:
  caddy-data:
