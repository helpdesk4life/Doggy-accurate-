name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a burst of commits should not leave three runs racing for the
# same Gradle cache entry. Cancel the superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches backend/Dockerfile. Testing the interpreter that ships is the
          # point: a developer on a newer Python still gets caught here.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # No Redis service. The tests inject fakeredis, so the suite is pure CPU
      # and finishes in seconds. The e2e job below is what exercises real Redis.
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

      # Gate: audits the full environment pytest just ran against — transitive
      # dependencies included. pip is upgraded first so the runner's own pip
      # cannot produce findings that are not project dependencies; --strict
      # fails the audit if dependency collection breaks instead of silently
      # skipping packages.
      - name: Audit dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install -U pip pip-audit
          pip-audit --strict

  android:
    name: Android tests and lint
    runs-on: ubuntu-latest
    # 30 because dependency-check's first NVD download (cold cache) is slow.
    timeout-minutes: 30
    # Job-level so the scan step's `if:` can read it: the `secrets` context is
    # not allowed in a condition, the `env` context is.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # compileOptions and jvmTarget are both 17 in app/build.gradle.kts.
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # compileSdk is 36. The runner image ships an SDK, but which platforms
          # it carries changes between image versions, so ask for them by name.
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # dependency-check stores its NVD database under the Gradle user home,
      # not ~/.dependency-check: DataExtension defaults to
      # <gradleUserHome>/dependency-check-data/<engine version>. The runners
      # are ephemeral, so without this the first run of every job re-downloads
      # the whole database. Keyed per run so every run saves a fresh copy and
      # the next one restores the newest.
      - name: Restore dependency-check database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: dependency-check-nvd-

      # One Gradle invocation so the Kotlin compile is shared between the two
      # tasks. --continue keeps lint running when a test fails, so a red run
      # still reports both rather than hiding the second problem behind the first.
      - name: Run unit tests and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --continue --console=plain

      # Gate: fails the job on any finding with CVSS >= 7 (see the
      # dependencyCheck block in app/build.gradle.kts).
      #
      # The NVD API key is required, not optional. dependency-check 13.0.0
      # ships `nvd.api.key=` as an empty default and NvdApiDataSource only
      # null-checks it, so a missing key reaches the NVD client as "" and
      # aborts the update with "Invalid API Key, length of 0 too short to
      # provided a masked partial key". Keyless, the 5-requests-per-30s limit
      # also makes the 425k-record cold download outlast the job timeout.
      #
      # So skip rather than fail when the secret is absent — a fork PR cannot
      # read it, and a red run there would say nothing about the code. Add the
      # secret to turn the gate on; UPGRADING.md says how.
      - name: Scan dependencies (OWASP dependency-check)
        if: env.NVD_API_KEY != ''
        working-directory: android
        run: ./gradlew :app:dependencyCheckAnalyze --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/dependency-check/
          if-no-files-found: ignore

  e2e:
    name: End-to-end against real Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # The scripts mint their own invite codes straight into Redis, so the gate
      # stays on and the run needs no seeded data.
      - name: Start the stack
        working-directory: backend
        run: docker compose up -d --build

      # `docker compose up -d` returns as soon as the containers are created, so
      # poll the health endpoint rather than assuming uvicorn is listening.
      - name: Wait for the backend
        working-directory: backend
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy within 120s"
          docker compose logs --no-color
          exit 1

      - name: Run the end-to-end suite
        working-directory: backend
        run: python scripts/e2e.py

      - name: Dump container logs
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color
